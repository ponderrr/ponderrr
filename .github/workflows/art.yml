name: generate profile art

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: generate year stats card
        run: |
          mkdir -p dist
          python3 scripts/build_stats.py --user ponderrr --out dist/stats.svg

      - name: generate contribution scenery
        run: python3 scripts/build_scenery.py --user ponderrr --out dist/scenery.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
