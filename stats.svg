    <text x="600" y="192" text-anchor="middle" fill="#8b949e" font-size="14"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">day streak</text>
  </g>
  <g class="in" style="animation-delay:0.7s">
