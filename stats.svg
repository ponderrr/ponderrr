      letter-spacing="-1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">4,717</text>
    <text x="320" y="192" text-anchor="middle" fill="#8b949e" font-size="14"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">contributions</text>
  </g>
  <g class="in" style="animation-delay:0.55s">
