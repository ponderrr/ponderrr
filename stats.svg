<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* CSS (not SMIL): Chromium never starts SMIL clocks for below-viewport
       images, and fill-mode:both degrades to fully-visible if disabled. */
    .card-in { animation: fadeUp 0.7s cubic-bezier(0.25, 1, 0.5, 1) 0.1s both; }
    .in { animation: fadeUp 0.55s cubic-bezier(0.25, 1, 0.5, 1) both; }
    .bar { animation: barIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes barIn { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .card-in, .in, .bar { animation: none; } }
  </style>
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g class="card-in">

    <rect x="150" y="20" width="900" height="280" rx="16" fill="#0d1117" filter="url(#shadow)"/>
    <rect x="150.5" y="20.5" width="899" height="279" rx="15.5"
      fill="none" stroke="#30363d" stroke-width="1"/>
    <line x1="166" y1="21" x2="1034" y2="21"
      stroke="url(#accent)" stroke-width="1.5" opacity="0.55"/>

    <text x="186" y="68" font-size="18"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <tspan fill="#7ee787">❯</tspan> <tspan fill="#e6edf3">stats --year 2026</tspan>
    </text>

  <g class="in" style="animation-delay:0.4s">
