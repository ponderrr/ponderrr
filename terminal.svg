<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="card"><rect x="150" y="24" width="900" height="330" rx="16"/></clipPath>
    <clipPath id="type1"><rect x="212" y="84" height="30" width="0">
      <animate attributeName="width" begin="0.9s" dur="0.42s" fill="freeze" calcMode="discrete"
        values="0;12;24;36;48;60;74"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="212" y="152" height="30" width="0">
      <animate attributeName="width" begin="2.3s" dur="0.91s" fill="freeze" calcMode="discrete"
        values="0;12;24;36;48;60;72;84;96;108;120;132;144;158"/>
    </rect></clipPath>
    <clipPath id="type3"><rect x="212" y="220" height="30" width="0">
      <animate attributeName="width" begin="4.2s" dur="0.91s" fill="freeze" calcMode="discrete"
        values="0;12;24;36;48;60;72;84;96;108;120;132;144;158"/>
    </rect></clipPath>
  </defs>

  <!-- Card entrance: fade + rise, ease-out, once -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.7s"
      calcMode="spline" keySplines="0.25 1 0.5 1" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 14;0 0"
      begin="0.1s" dur="0.7s" calcMode="spline" keySplines="0.25 1 0.5 1" fill="freeze"/>

    <!-- Terminal card -->
    <rect x="150" y="24" width="900" height="330" rx="16" fill="#0d1117" filter="url(#shadow)"/>
    <rect x="150.5" y="24.5" width="899" height="329" rx="15.5" fill="none" stroke="#30363d" stroke-width="1"/>

    <!-- Title bar -->
    <g clip-path="url(#card)">
      <rect x="150" y="24" width="900" height="40" fill="#161b22"/>
      <line x1="150" y1="64" x2="1050" y2="64" stroke="#30363d" stroke-width="1"/>
      <!-- light catching the top edge -->
      <line x1="166" y1="25" x2="1034" y2="25" stroke="url(#accent)" stroke-width="1.5" opacity="0.55"/>
    </g>
    <circle cx="178" cy="44" r="6.5" fill="#ff5f56"/>
    <circle cx="200" cy="44" r="6.5" fill="#ffbd2e"/>
    <circle cx="222" cy="44" r="6.5" fill="#27c93f"/>
    <text x="600" y="49" text-anchor="middle" fill="#8b949e"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">andrew@ponderrr — zsh</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">

      <!-- ❯ whoami -->
      <text x="186" y="108" fill="#7ee787">❯</text>
      <text x="212" y="108" fill="#e6edf3" clip-path="url(#type1)">whoami</text>

      <text x="186" y="142" fill="#8b949e" opacity="0">
        andrew ponder · ai/ml engineer · mandeville, la
        <animate attributeName="opacity" from="0" to="1" begin="1.55s" dur="0.5s"
          calcMode="spline" keySplines="0.25 1 0.5 1" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 8;0 0"
          begin="1.55s" dur="0.5s" calcMode="spline" keySplines="0.25 1 0.5 1" fill="freeze"/>
      </text>

      <!-- ❯ cat stack.txt -->
      <text x="186" y="176" fill="#7ee787" opacity="0">❯
        <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.25s" fill="freeze"/>
      </text>
      <text x="212" y="176" fill="#e6edf3" clip-path="url(#type2)">cat stack.txt</text>

      <text x="186" y="210" fill="#8b949e" opacity="0">
        python · typescript · rust · c++ · tensorflow · postgres · docker
        <animate attributeName="opacity" from="0" to="1" begin="3.45s" dur="0.5s"
          calcMode="spline" keySplines="0.25 1 0.5 1" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 8;0 0"
          begin="3.45s" dur="0.5s" calcMode="spline" keySplines="0.25 1 0.5 1" fill="freeze"/>
      </text>

      <!-- ❯ ./focus –now -->
      <text x="186" y="244" fill="#7ee787" opacity="0">❯
        <animate attributeName="opacity" from="0" to="1" begin="4.1s" dur="0.25s" fill="freeze"/>
      </text>
      <text x="212" y="244" fill="#e6edf3" clip-path="url(#type3)">./focus --now</text>

      <!-- punchline -->
      <text x="186" y="288" fill="url(#accent)" font-size="26" font-weight="700" opacity="0">
        building things that learn
        <animate attributeName="opacity" from="0" to="1" begin="5.35s" dur="0.65s"
          calcMode="spline" keySplines="0.25 1 0.5 1" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 10;0 0"
          begin="5.35s" dur="0.65s" calcMode="spline" keySplines="0.25 1 0.5 1" fill="freeze"/>
      </text>

      <!-- idle prompt: the living end-state -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="6.2s" dur="0.35s"
          calcMode="spline" keySplines="0.25 1 0.5 1" fill="freeze"/>
        <text x="186" y="324" fill="#7ee787">❯</text>
        <rect x="212" y="306" width="11" height="22" fill="#e6edf3">
          <animate attributeName="opacity" begin="6.6s" dur="1.1s" repeatCount="indefinite"
            calcMode="discrete" values="1;0"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
