<svg width="1200" height="250" viewBox="0 0 1200 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
      <animate attributeName="x1" dur="12s" values="0%;25%;0%" repeatCount="indefinite"/>
      <animate attributeName="x2" dur="12s" values="100%;75%;100%" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="band"><rect x="150" y="70" width="900" height="140" rx="16"/></clipPath>
  </defs>

  <!-- sign-off -->
  <text x="600" y="42" text-anchor="middle" fill="url(#waveGrad)"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="24" font-weight="600" letter-spacing="-0.5">always pondering.</text>

  <g clip-path="url(#band)">
    <rect x="150" y="70" width="900" height="140" fill="url(#waveGrad)" opacity="0.08"/>

    <!-- depth layer: softer, slower, phase-shifted -->
    <path fill="url(#waveGrad)" fill-opacity="0.3">
      <animate attributeName="d" dur="13s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
        keyTimes="0;0.33;0.66;1"
        values="
          M-360,140 C340,180 620,90 1560,150 L1560,250 L-360,250 Z;
          M-360,115 C200,95 610,185 1560,95 L1560,250 L-360,250 Z;
          M-360,135 C220,80 620,175 1560,120 L1560,250 L-360,250 Z;
          M-360,140 C340,180 620,90 1560,150 L1560,250 L-360,250 Z"/>
    </path>

    <!-- main wave -->
    <path fill="url(#waveGrad)" fill-opacity="0.85">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
        keyTimes="0;0.33;0.66;1"
        values="
          M-360,130 C220,85 620,180 1560,105 L1560,250 L-360,250 Z;
          M-360,155 C340,190 620,85 1560,165 L1560,250 L-360,250 Z;
          M-360,120 C200,100 610,190 1560,90 L1560,250 L-360,250 Z;
          M-360,130 C220,85 620,180 1560,105 L1560,250 L-360,250 Z"/>
    </path>
  </g>
</svg>
